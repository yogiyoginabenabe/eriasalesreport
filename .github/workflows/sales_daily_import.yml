name: Yogibo store report daily import

on:
  schedule:
    - cron: "30 13 * * *" # 22:30 JST
  workflow_dispatch:
    inputs:
      store_report_date:
        description: "再取得する日（YYYYMMDD、空欄なら日本時間の当日）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: yogibo-store-report-daily
  cancel-in-progress: false

jobs:
  import-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      YOGIBO_STAFF_ID: ${{ secrets.YOGIBO_STAFF_ID }}
      YOGIBO_STAFF_PASSWORD: ${{ secrets.YOGIBO_STAFF_PASSWORD }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth playwright
          python -m playwright install --with-deps chromium

      - name: Download and upsert daily sales
        shell: bash
        run: |
          if [ -n "${{ inputs.store_report_date }}" ]; then
            python scripts/store_report_daily.py --date "${{ inputs.store_report_date }}"
          else
            python scripts/store_report_daily.py
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yogibo-store-report-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
