name: Yogibo store report daily import

on:
  schedule:
    - cron: "30 13 * * *" # 22:30 JST
  workflow_dispatch:
    inputs:
      store_report_date:
        description: "1日だけ再取得（YYYYMMDD）。過去一括取得時は空欄"
        required: false
        default: ""
        type: string
      backfill_start_month:
        description: "過去一括取得の開始月（YYYYMM、例: 202503）"
        required: false
        default: ""
        type: string
      backfill_end_month:
        description: "過去一括取得の終了月（YYYYMM、例: 202609）"
        required: false
        default: ""
        type: string
      summary_start:
        description: "サイト高速サマリー開始日（YYYYMMDD）"
        required: false
        default: ""
        type: string
      summary_end:
        description: "サイト高速サマリー終了日（YYYYMMDD）"
        required: false
        default: ""
        type: string
      summary_period:
        description: "サイト高速サマリー形式（m=月別、w=週別）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: yogibo-store-report-daily
  cancel-in-progress: false

jobs:
  import-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      YOGIBO_STAFF_ID: ${{ secrets.YOGIBO_STAFF_ID }}
      YOGIBO_STAFF_PASSWORD: ${{ secrets.YOGIBO_STAFF_PASSWORD }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth playwright
          python -m playwright install --with-deps chromium

      - name: Download and upsert daily sales
        shell: bash
        run: |
          if [ -n "${{ inputs.summary_start }}" ]; then
            python scripts/store_report_daily.py \
              --summary-start "${{ inputs.summary_start }}" \
              --summary-end "${{ inputs.summary_end }}" \
              --summary-period "${{ inputs.summary_period }}"
          elif [ -n "${{ inputs.backfill_start_month }}" ]; then
            END_MONTH="${{ inputs.backfill_end_month }}"
            if [ -z "$END_MONTH" ]; then
              END_MONTH="${{ inputs.backfill_start_month }}"
            fi
            python scripts/store_report_daily.py \
              --start-month "${{ inputs.backfill_start_month }}" \
              --end-month "$END_MONTH"
          elif [ -n "${{ inputs.store_report_date }}" ]; then
            python scripts/store_report_daily.py --date "${{ inputs.store_report_date }}"
          else
            python scripts/store_report_daily.py
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yogibo-store-report-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
