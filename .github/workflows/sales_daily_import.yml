name: Yogibo sales daily import

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "今年CSVの最終日（YYYY-MM-DD、省略時は日本時間の昨日）"
        required: false
        type: string

jobs:
  import-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
      YOGIBO_STAFF_ID: ${{ secrets.YOGIBO_STAFF_ID }}
      YOGIBO_STAFF_PASSWORD: ${{ secrets.YOGIBO_STAFF_PASSWORD }}
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth playwright
          playwright install --with-deps chromium

      - name: Download and save sales CSV
        run: |
          if [ -n "${{ inputs.end_date }}" ]; then
            python scripts/store_report_daily.py --end "${{ inputs.end_date }}"
          else
            python scripts/store_report_daily.py
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yogibo-sales-import-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
